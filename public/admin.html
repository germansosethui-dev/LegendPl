<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legend Pl — ADMIN</title><link rel="stylesheet" href="/styles.css"></head><body><main id="adminPage" class="view active" style="max-width:1200px;padding:20px"><h1>🔴 Legend Pl — ADMIN</h1><p id="status" class="muted">Проверка доступа…</p><div id="stats" class="grid"></div><div class="tabs"><button data-tab="matches">Матчи</button><button data-tab="cancels">Отмены</button><button data-tab="reports">Репорты</button><button data-tab="users">Игроки</button></div><section id="matches" class="card"></section><section id="cancels" class="card" hidden></section><section id="reports" class="card" hidden></section><section id="users" class="card" hidden></section></main><div id="modalRoot"></div><script>
const id=localStorage.getItem('legendpl_user');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o={}){const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw Error(d.message||'Ошибка');return d}const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
async function load(){const a=await api('/api/check-admin?userId='+id);if(!a.isAdmin){$('status').textContent='Доступ закрыт';return}$('status').textContent='Доступ подтверждён';await Promise.all([stats(),matches(),cancels(),reports(),users()])}
async function stats(){const d=await api('/api/admin/stats?adminId='+id);$('stats').innerHTML=[['Онлайн',d.online],['Игроки',d.users],['Матчи',d.matches],['Репорты',d.reports],['Заявки отмены',d.cancelRequests]].map(x=>`<div class="card"><span>${x[0]}</span><h2>${x[1]}</h2></div>`).join('')}
async function matches(){const d=await api('/api/admin/matches?adminId='+id);$('matches').innerHTML='<h2>Матчи</h2>'+(d.matches.length?d.matches.map(m=>`<article class="card"><h3>${esc(m.id)}</h3><p>${m.mode} · ${m.ranked?'Ранговый':'Обычный'} · ${esc(m.map||'Драфт')} · ${m.rounds||'—'} раундов</p><p>Статус: ${m.status}</p><div class="teams"><div class="team"><b>T</b>${m.teamT.map(u=>`<div class="member"><img src="${u.avatar||''}">${esc(u.inGameNick)}</div>`).join('')}</div><div class="team"><b>CT</b>${m.teamCT.map(u=>`<div class="member"><img src="${u.avatar||''}">${esc(u.inGameNick)}</div>`).join('')}</div></div><div>${(m.screenshots||[]).map(s=>`<a href="${s.url}" target="_blank"><img src="${s.url}" style="width:180px;border-radius:10px;margin:5px"></a>`).join('')}</div>${m.status!=='resolved'?`<div class="row"><button onclick="resolveMatch('${m.id}','T')">Победа T</button><button onclick="resolveMatch('${m.id}','CT')">Победа CT</button><button class="danger" onclick="cancelMatch('${m.id}')">Отменить матч</button></div><div class="elo-box">${m.participants.map(u=>`<label>${esc(u.inGameNick)} <input type="number" id="elo-${m.id}-${u.id}" value="0"></label>`).join('')}</div>`:'<p class="muted">Матч обработан.</p>'}</article>`).join(''):'<p>Нет активных матчей.</p>'}
function ask(title,text){return new Promise(resolve=>{const b=document.createElement('div');b.className='modal';b.innerHTML=`<div class="modal-box"><h3>${esc(title)}</h3><p>${esc(text)}</p><input id="admInput" placeholder="Введите текст"><div class="row"><button id="admOk">Подтвердить</button><button id="admNo" class="secondary">Отмена</button></div></div>`;document.body.appendChild(b);b.querySelector('#admOk').onclick=()=>{const v=b.querySelector('#admInput').value.trim();b.remove();resolve(v)};b.querySelector('#admNo').onclick=()=>{b.remove();resolve(null)}})}
async function resolveMatch(mid,w){const d={};document.querySelectorAll(`[id^="elo-${mid}-"]`).forEach(i=>d[i.id.split('-').pop()]=Number(i.value||0));try{await post('/api/admin/match/'+encodeURIComponent(mid)+'/resolve',{adminId:id,winnerTeam:w,eloChanges:d});await load()}catch(e){await ask('Ошибка',e.message)}}
async function cancelMatch(mid){const reason=await ask('Отмена матча','Укажите причину отмены');if(reason===null)return;try{await post('/api/admin/match/'+encodeURIComponent(mid)+'/cancel',{adminId:id,reason:reason||'Отменено администратором'});await load()}catch(e){await ask('Ошибка',e.message)}}
async function cancels(){const d=await api('/api/admin/cancel-requests?adminId='+id);$('cancels').innerHTML='<h2>Заявки на отмену</h2>'+(d.requests.length?d.requests.map(r=>`<div class="card"><b>${esc(r.id)}</b><p>Матч: ${esc(r.matchId)}</p><p>Игрок: ${esc(r.user?.inGameNick||'—')}</p><p>${esc(r.reason)}</p>${r.status==='open'?`<div class="row"><button onclick="answerCancel('${r.id}','approved')">Одобрить</button><button class="danger" onclick="answerCancel('${r.id}','rejected')">Отклонить</button></div>`:'<p class="muted">'+r.status+'</p>'}</div>`).join(''):'<p>Нет заявок.</p>'}
async function answerCancel(r,s){await post('/api/admin/cancel-request/'+r,{adminId:id,status:s});await load()}
async function reports(){const d=await api('/api/admin/reports?adminId='+id);$('reports').innerHTML='<h2>Репорты</h2>'+d.reports.map(r=>`<div class="card"><b>${esc(r.id)}</b><p>${esc(r.reporter?.inGameNick||'—')} → ${esc(r.target?.inGameNick||'—')}</p><p>Причина: ${esc(r.reason)}</p><p>Статус: ${esc(r.status)}</p>${r.status==='open'?`<button onclick="closeReport('${r.id}')">Закрыть</button>`:''}</div>`).join('')}
async function closeReport(r){await post('/api/admin/report/'+r,{adminId:id,status:'closed'});await load()}
async function users(){const d=await api('/api/admin/users?adminId='+id);$('users').innerHTML='<h2>Игроки</h2>'+d.users.map(u=>`<div class="member"><img src="${u.avatar||''}"><div style="flex:1"><b>${u.isAdmin?'<span class="admin">ADMIN</span> ':''}${esc(u.inGameNick)}</b><div class="muted">ID ${u.id} · ELO ${u.stats['1v1'].elo}</div></div>${!u.isAdmin?`<button onclick="act('${u.id}','ban')">Бан</button><button onclick="act('${u.id}','mute')">Мут</button>`:''}</div>`).join('')}
async function act(uid,a){const h=24;await post('/api/admin/action',{adminId:id,targetUserId:uid,action:a,hours:h});await load()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('section').forEach(s=>s.hidden=true);$(b.dataset.tab).hidden=false});load();</script></body></html>
