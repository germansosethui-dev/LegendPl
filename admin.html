<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StandKnife — Админ-панель</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { min-height:100vh; }
    .admin-wrap { max-width:1200px; margin:0 auto; padding:24px; }
    .admin-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
    .admin-grid { display:grid; grid-template-columns:1fr; gap:18px; }
    .admin-card { background:#1e293b; border:1px solid #334155; border-radius:16px; padding:18px; }
    .admin-card h2 { margin-bottom:14px; color:#3b82f6; }
    .admin-table { width:100%; border-collapse:collapse; }
    .admin-table th,.admin-table td { padding:9px; border-bottom:1px solid #334155; text-align:left; vertical-align:middle; }
    .admin-actions { display:flex; flex-wrap:wrap; gap:6px; }
    .admin-actions button { padding:6px 9px; min-height:34px; font-size:12px; }
    .admin-muted { color:#94a3b8; font-size:13px; }
    .match-card { background:#0f172a; border:1px solid #334155; border-radius:12px; padding:12px; margin:8px 0; }
    .match-users { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
    .match-user { display:flex; align-items:center; gap:6px; background:#1e293b; border-radius:8px; padding:6px 8px; }
    .match-user img { width:28px; height:28px; border-radius:50%; object-fit:cover; }
    .screenshots { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .screenshots a { display:block; }
    .screenshots img { width:180px; max-height:130px; object-fit:cover; border-radius:8px; border:1px solid #334155; }
    .danger { background:#7f1d1d !important; }
    .success { background:#166534 !important; }
    @media(max-width:600px){ .admin-wrap{padding:12px 10px}.admin-header{align-items:flex-start;flex-direction:column}.admin-card{padding:13px;overflow-x:auto}.admin-table{min-width:720px}.screenshots img{width:140px} }
  </style>
</head>
<body>
  <div class="admin-wrap">
    <div class="admin-header">
      <div>
        <h1>StandKnife — Админ-панель</h1>
        <div id="adminStatus" class="admin-muted">Проверка прав...</div>
      </div>
      <button id="backBtn">← Вернуться на сайт</button>
    </div>

    <div id="denied" class="admin-card" style="display:none;">
      <h2>Доступ запрещён</h2>
      <p>Откройте админ-панель из аккаунта администратора.</p>
    </div>

    <div id="dashboard" class="admin-grid" style="display:none;">
      <section class="admin-card">
        <h2>Игроки</h2>
        <button id="refreshUsers">Обновить</button>
        <div style="overflow-x:auto;margin-top:12px;">
          <table class="admin-table">
            <thead><tr><th>Игрок</th><th>ID</th><th>Статус</th><th>Действия</th></tr></thead>
            <tbody id="usersTable"></tbody>
          </table>
        </div>
      </section>

      <section class="admin-card">
        <h2>Матчи / результаты</h2>
        <button id="refreshMatches">Обновить</button>
        <div id="matchesList" style="margin-top:12px;"></div>
      </section>
    </div>
  </div>

<script>
const adminId = localStorage.getItem('userId');
const statusEl = document.getElementById('adminStatus');
const dashboard = document.getElementById('dashboard');
const denied = document.getElementById('denied');

async function api(url, options = {}) {
  const res = await fetch(url, options);
  return res.json();
}

function post(url, body) {
  return api(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
}

function avatar(url) {
  return url || 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" rx="20" fill="#334155"/></svg>');
}

async function checkAdmin() {
  if (!adminId) return deny();
  const res = await api('/api/check-admin?userId=' + encodeURIComponent(adminId));
  if (!res.isAdmin) return deny();
  statusEl.textContent = 'Вы вошли как администратор';
  dashboard.style.display = 'grid';
  await Promise.all([loadUsers(), loadMatches()]);
}

function deny() {
  statusEl.textContent = 'Нет прав администратора';
  denied.style.display = 'block';
}

async function loadUsers() {
  const res = await api('/api/admin/users?adminId=' + encodeURIComponent(adminId));
  if (!res.success) return;
  document.getElementById('usersTable').innerHTML = res.users.map(u => `
    <tr>
      <td><strong>${escapeHtml(u.inGameNick || 'Игрок')}</strong>${u.isAdmin ? ' 👑' : ''}</td>
      <td>${escapeHtml(u.inGameId || u.id)}</td>
      <td>${u.banned ? '🔴 Бан' : u.muted ? '🟡 Мут' : '🟢 Нормально'}</td>
      <td><div class="admin-actions">
        ${!u.isAdmin ? `<button class="danger" onclick="adminAction('${u.id}','ban')">Бан</button><button onclick="adminAction('${u.id}','mute')">Мут</button>` : ''}
        ${u.banned ? `<button class="success" onclick="adminAction('${u.id}','unban')">Разбан</button>` : ''}
        ${u.muted ? `<button class="success" onclick="adminAction('${u.id}','unmute')">Размут</button>` : ''}
      </div></td>
    </tr>`).join('');
}

async function adminAction(targetUserId, action) {
  let durationHours = 0;
  let reason = '';
  if (action === 'ban' || action === 'mute') {
    durationHours = Number(prompt('Срок в часах:', '24'));
    if (!durationHours || durationHours < 1) return;
    reason = prompt('Причина:', '') || '';
  }
  const res = await post('/api/admin-action', { adminId, targetUserId, action, durationHours, reason });
  alert(res.message || (res.success ? 'Готово' : 'Ошибка'));
  if (res.success) loadUsers();
}

async function loadMatches() {
  const res = await api('/api/admin/matches?adminId=' + encodeURIComponent(adminId));
  const box = document.getElementById('matchesList');
  if (!res.success || !res.matches.length) {
    box.innerHTML = '<p class="admin-muted">Активных матчей и загруженных результатов сейчас нет.</p>';
    return;
  }
  box.innerHTML = res.matches.map(m => `
    <div class="match-card">
      <strong>${escapeHtml(m.mode)} ${m.ranked ? '• Ранговый' : '• Обычный'}</strong>
      <div class="admin-muted">ID: ${escapeHtml(m.id)} • Карта: ${escapeHtml(m.map || '—')} • Статус: ${escapeHtml(m.status || '—')}</div>
      <div class="match-users">
        ${m.participants.map(p => `<div class="match-user"><img src="${avatar(p.avatar)}"><span>${escapeHtml(p.inGameNick || 'Игрок')}</span></div>`).join('')}
      </div>
      ${(m.screenshots || []).length ? `<div><strong>Скриншоты результатов:</strong><div class="screenshots">${m.screenshots.map(s => `<a href="${s.url}" target="_blank" rel="noopener"><img src="${s.url}" alt="Результат"></a>`).join('')}</div></div>` : '<div class="admin-muted">Скриншот результата ещё не загружен.</div>'}
      <div style="margin-top:10px;"><button class="danger" onclick="cancelMatch('${m.id}')">Отменить матч</button></div>
    </div>`).join('');
}

async function cancelMatch(matchId) {
  if (!confirm('Отменить этот матч?')) return;
  const res = await post('/api/cancel-match', { adminId, matchId });
  alert(res.message || 'Готово');
  if (res.success) loadMatches();
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('refreshUsers').onclick = loadUsers;
document.getElementById('refreshMatches').onclick = loadMatches;
document.getElementById('backBtn').onclick = () => location.href = '/';
checkAdmin();
</script>
</body>
</html>
